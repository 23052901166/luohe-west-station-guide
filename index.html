<!-- 大屏预览弹窗（匹配真实双栏大屏） -->
<div id="previewModal" class="modal fullscreen">
    <div class="screen-container">
        <div class="waiting-screen" id="previewScreen">
            <div class="screen-header">
                <div class="welcome-text" id="previewStationName">漯河西站</div>
                <div class="core-values">
                    社会主义核心价值观<br>
                    富强 民主 文明 和谐<br>
                    自由 平等 公正 法治<br>
                    爱国 敬业 诚信 友善
                </div>
                <div class="ticket-tip">
                    开车前15分钟开始检票<br>
                    开车前5分钟停止检票
                </div>
            </div>
            
            <!-- 双栏车次区域（核心修改） -->
            <table>
                <tbody id="previewTbody"></tbody>
            </table>
            
            <div class="screen-footer">
                <div class="safety-tip">
                    严禁携带易燃易爆危险品进站上车 保管好自己的随身物品
                </div>
                <div class="datetime" id="previewDatetime"></div>
            </div>
        </div>
        <button class="close-screen-btn" onclick="closePreviewModal()">关闭预览</button>
    </div>
</div>
